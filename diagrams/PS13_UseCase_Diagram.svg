<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="780" fill="#ffffff"/>

  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Patient Health Record Consent Management System — Use-Case Diagram
  </text>

  <!-- System boundary -->
  <rect x="270" y="55" width="600" height="650" fill="#f7fbff" stroke="#2c3e50" stroke-width="2" rx="6"/>
  <text x="570" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Consent Management System</text>

  <!-- ACTORS -->
  <g transform="translate(95,360)">
    <circle cx="0" cy="-60" r="14" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-46" x2="0" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="-24" y1="-25" x2="24" y2="-25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="10" x2="-22" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="10" x2="22" y2="45" stroke="#333" stroke-width="2"/>
    <text x="0" y="70" text-anchor="middle" font-size="14" font-weight="bold">Patient</text>
  </g>

  <g transform="translate(1000,360)">
    <circle cx="0" cy="-60" r="14" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-46" x2="0" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="-24" y1="-25" x2="24" y2="-25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="10" x2="-22" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="10" x2="22" y2="45" stroke="#333" stroke-width="2"/>
    <text x="0" y="70" text-anchor="middle" font-size="13" font-weight="bold">Clinic</text>
    <text x="0" y="86" text-anchor="middle" font-size="13" font-weight="bold">Administrator</text>
  </g>

  <g transform="translate(570,745)">
    <rect x="-58" y="-24" width="116" height="34" fill="#eef2f5" stroke="#555" stroke-width="1.5" rx="4"/>
    <text x="0" y="-2" text-anchor="middle" font-size="12" font-style="italic">«system»</text>
    <text x="0" y="14" text-anchor="middle" font-size="12" font-weight="bold">Audit Log</text>
  </g>

  <!-- USE CASES: left column (Patient-driven) -->
  <ellipse cx="440" cy="130" rx="110" ry="34" fill="#eaf4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="440" y="126" text-anchor="middle" font-size="13">Grant Time-Bound</text>
  <text x="440" y="142" text-anchor="middle" font-size="13">Consent Access</text>

  <ellipse cx="440" cy="220" rx="95" ry="30" fill="#eaf4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="440" y="225" text-anchor="middle" font-size="13">Revoke Consent</text>

  <ellipse cx="440" cy="300" rx="105" ry="30" fill="#eaf4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="440" y="305" text-anchor="middle" font-size="13">View Consent History</text>

  <!-- right column (Clinic Admin-driven) -->
  <ellipse cx="700" cy="150" rx="115" ry="34" fill="#eaf4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="700" y="146" text-anchor="middle" font-size="13">Access Diagnostic</text>
  <text x="700" y="162" text-anchor="middle" font-size="13">Records</text>

  <ellipse cx="700" cy="245" rx="118" ry="32" fill="#eaf4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="700" y="241" text-anchor="middle" font-size="12">Request Emergency</text>
  <text x="700" y="257" text-anchor="middle" font-size="12">Override Access</text>

  <!-- shared / included use cases -->
  <ellipse cx="700" cy="345" rx="112" ry="30" fill="#fff6e0" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="700" y="350" text-anchor="middle" font-size="13">Verify Consent Validity</text>

  <ellipse cx="500" cy="440" rx="120" ry="32" fill="#fff6e0" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="500" y="436" text-anchor="middle" font-size="13">Record Audit</text>
  <text x="500" y="452" text-anchor="middle" font-size="13">Trail Entry</text>

  <!-- extension use case, placed to the far left inside boundary, below main patient use cases -->
  <ellipse cx="440" cy="540" rx="120" ry="32" fill="#e9fbea" stroke="#1e6e2e" stroke-width="1.5"/>
  <text x="440" y="536" text-anchor="middle" font-size="12">Receive Consent</text>
  <text x="440" y="552" text-anchor="middle" font-size="12">Expiry Notification</text>

  <!-- ASSOCIATIONS -->
  <line x1="138" y1="330" x2="335" y2="145" stroke="#333" stroke-width="1.3"/>
  <line x1="138" y1="360" x2="345" y2="220" stroke="#333" stroke-width="1.3"/>
  <line x1="138" y1="390" x2="335" y2="298" stroke="#333" stroke-width="1.3"/>

  <line x1="960" y1="330" x2="800" y2="160" stroke="#333" stroke-width="1.3"/>
  <line x1="960" y1="360" x2="805" y2="248" stroke="#333" stroke-width="1.3"/>

  <line x1="570" y1="722" x2="520" y2="472" stroke="#333" stroke-width="1.3"/>

  <!-- INCLUDE relationships -->
  <path d="M 640 182 C 590 260, 620 320, 650 335" fill="none" stroke="#8a6d00" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="560" y="260" font-size="11" font-style="italic" fill="#8a6d00">«include»</text>

  <line x1="440" y1="164" x2="470" y2="412" stroke="#8a6d00" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="330" y="270" font-size="11" font-style="italic" fill="#8a6d00">«include»</text>

  <line x1="470" y1="248" x2="495" y2="410" stroke="#8a6d00" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="500" y="335" font-size="11" font-style="italic" fill="#8a6d00">«include»</text>

  <!-- EXTEND relationships -->
  <!-- extend: Receive Expiry Notification to Grant Consent, routed along outer-left -->
  <path d="M 380 512 C 300 460, 300 200, 375 148" fill="none" stroke="#1e6e2e" stroke-width="1.3" stroke-dasharray="2,4" marker-end="url(#arrowGreen)"/>
  <text x="290" y="330" font-size="11" font-style="italic" fill="#1e6e2e">«extend»</text>

  <!-- extend: Emergency Override to Access Diagnostic Records -->
  <line x1="710" y1="213" x2="702" y2="185" stroke="#1e6e2e" stroke-width="1.3" stroke-dasharray="2,4" marker-end="url(#arrowGreen)"/>
  <text x="720" y="205" font-size="11" font-style="italic" fill="#1e6e2e">«extend»</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a6d00"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e6e2e"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(895,60)">
    <rect x="-10" y="-20" width="200" height="90" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#8a6d00" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="38" y="4" font-size="12" fill="#333">«include»</text>
    <line x1="0" y1="24" x2="30" y2="24" stroke="#1e6e2e" stroke-width="1.3" stroke-dasharray="2,4" marker-end="url(#arrowGreen)"/>
    <text x="38" y="28" font-size="12" fill="#333">«extend»</text>
    <line x1="0" y1="48" x2="30" y2="48" stroke="#333" stroke-width="1.3"/>
    <text x="38" y="52" font-size="12" fill="#333">association</text>
  </g>
</svg>
